    let userAnswers = {};
    let currentFilter = 'all';

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      const filteredData = quizData.filter(item => {
        if (currentFilter === 'basic') return item.type === 'basic';
        if (currentFilter === 'advanced') return item.type === 'advanced';
        return true;
      });

      filteredData.forEach(q => {
        const isAnswered = userAnswers.hasOwnProperty(q.id);
        const selectedOpt = userAnswers[q.id];

        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl shadow-sm border border-slate-200 p-6 transition duration-200 hover:shadow-md";
        
        const badgeColor = q.type === 'basic' ? 'bg-sky-100 text-sky-800 border-sky-200' : 'bg-purple-100 text-purple-800 border-purple-200';
        const badgeText = q.type === 'basic' ? '基礎觀念' : '進階思考';

        let optionsHTML = '';
        q.options.forEach((opt, idx) => {
          let btnStyle = "bg-slate-50 border-slate-200 text-slate-700 hover:bg-indigo-50 hover:border-indigo-300";
          
          if (isAnswered) {
            if (idx === q.answer) {
              btnStyle = "bg-emerald-100 border-emerald-500 text-emerald-900 font-semibold";
            } else if (idx === selectedOpt) {
              btnStyle = "bg-rose-100 border-rose-500 text-rose-900 font-semibold";
            } else {
              btnStyle = "bg-slate-50 border-slate-200 text-slate-400 opacity-60 cursor-not-allowed";
            }
          }

          optionsHTML += `
            <button 
              onclick="selectAnswer(${q.id}, ${idx})" 
              ${isAnswered ? 'disabled' : ''}
              class="w-full text-left px-4 py-3 rounded-xl border text-sm sm:text-base transition duration-150 flex items-center justify-between ${btnStyle}">
              <span>${opt}</span>
              ${isAnswered && idx === q.answer ? '<span class="text-emerald-600 font-bold ml-2">✓ 正確</span>' : ''}
              ${isAnswered && idx === selectedOpt && idx !== q.answer ? '<span class="text-rose-600 font-bold ml-2">✕ 錯誤</span>' : ''}
            </button>
          `;
        });

        let explanationHTML = '';
        if (isAnswered) {
          explanationHTML = `
            <div class="mt-4 p-4 rounded-xl ${selectedOpt === q.answer ? 'bg-emerald-50 border border-emerald-200' : 'bg-rose-50 border border-rose-200'}">
              <div class="font-bold text-sm mb-1 ${selectedOpt === q.answer ? 'text-emerald-800' : 'text-rose-800'}">
                ${selectedOpt === q.answer ? '🎉 回答正確！' : '💡 解析與觀念：'}
              </div>
              <div class="text-xs sm:text-sm text-slate-700 leading-relaxed">
                ${q.explanation}
              </div>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-semibold px-2.5 py-1 rounded-full border ${badgeColor}">${badgeText}</span>
            <span class="text-xs text-slate-400 font-medium">題號 #${q.id}</span>
          </div>
          <h3 class="text-base sm:text-lg font-bold text-slate-800 mb-2">${q.title}</h3>
          <p class="text-sm sm:text-base text-slate-700 mb-4 leading-relaxed">${q.question}</p>
          <div class="space-y-2.5">${optionsHTML}</div>
          ${explanationHTML}
        `;

        container.appendChild(card);
      });

      updateScoreboard();
      renderMathInElement(container, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ],
        throwOnError: false
      });
    }

    function selectAnswer(questionId, optionIndex) {
      userAnswers[questionId] = optionIndex;
      renderQuiz();
    }

    function updateScoreboard() {
      const totalQuestions = quizData.length;
      const answeredCount = Object.keys(userAnswers).length;
      
      let correctCount = 0;
      Object.keys(userAnswers).forEach(qId => {
        const q = quizData.find(item => item.id == qId);
        if (q && userAnswers[qId] === q.answer) {
          correctCount++;
        }
      });

      document.getElementById('score-count').innerText = `${correctCount} / ${totalQuestions}`;
      const percentage = Math.round((answeredCount / totalQuestions) * 100);
      document.getElementById('progress-count').innerText = `${percentage}%`;
    }

    function filterCategory(cat) {
      currentFilter = cat;
      ['all', 'basic', 'advanced'].forEach(c => {
        const btn = document.getElementById(`tab-${c}`);
        if (c === cat) {
          btn.className = "px-4 py-2 rounded-lg text-sm font-semibold transition bg-indigo-600 text-white shadow";
        } else {
          btn.className = "px-4 py-2 rounded-lg text-sm font-semibold transition bg-white text-slate-600 hover:bg-slate-100 border border-slate-200";
        }
      });
      renderQuiz();
    }

    function resetQuiz() {
      if (confirm('確定要清除所有答案重來嗎？')) {
        userAnswers = {};
        renderQuiz();
      }
    }

    // 初始化渲染
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });
  </script>
</body>
</html>
